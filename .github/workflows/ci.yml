name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: taiki-e/install-action@just
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - uses: astral-sh/setup-uv@v4
      - uses: actions/setup-node@v6
        with:
          node-version: "22"
      # `just check` resolves every publish against ClawHub with `--dry-run`.
      # The token is required: without it the CLI cannot resolve the publisher,
      # so a slug another publisher also owns fails as ambiguous.
      - name: Install ClawHub CLI
        run: npm install -g clawhub
      - name: Authenticate to ClawHub
        env:
          CLAWHUB_TOKEN: ${{ secrets.CLAWHUB_TOKEN }}
        run: |
          [ -n "$CLAWHUB_TOKEN" ] || (echo "CLAWHUB_TOKEN secret is required." && exit 1)
          clawhub login --token "$CLAWHUB_TOKEN" --no-browser
      - run: just check
      - name: Ensure no uncommitted changes
        run: git diff --exit-code
